[package]
name = "northstar-client"
version = "0.1.0"
description = "Northstar web, desktop, and mobile client"
authors = ["PurePortal"]
edition = "2024"

[lib]
name = "northstar_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
