name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "24"
  PNPM_VERSION: 10.33.2

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy,rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/client/src-tauri -> target

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: pnpm check

      - name: Format-check Tauri
        run: cargo fmt --check --manifest-path apps/client/src-tauri/Cargo.toml

      - name: Check Tauri
        run: cargo clippy --locked --manifest-path apps/client/src-tauri/Cargo.toml --all-targets -- -D warnings

  containers:
    name: Build ${{ matrix.name }} container
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: apps/server/Dockerfile
            tag: northstar-server:ci
            build_args: ""
          - name: landing
            dockerfile: apps/landing/Dockerfile
            tag: northstar-landing:ci
            build_args: VITE_CLIENT_URL=https://app.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          load: true
          pull: true
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=northstar-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=northstar-${{ matrix.name }}
