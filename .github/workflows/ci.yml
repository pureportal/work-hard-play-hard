name: CI

run-name: CI / ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      delivery_gate:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.delivery_gate && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.delivery_gate }}

env:
  NODE_VERSION: "24"
  PNPM_VERSION: 10.33.2

jobs:
  workflow-lint:
    name: Validate workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  quality:
    name: Lint, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy,rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/client/src-tauri -> target

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: pnpm check

      - name: Format-check Tauri
        run: cargo fmt --check --manifest-path apps/client/src-tauri/Cargo.toml

      - name: Check Tauri
        run: cargo clippy --locked --manifest-path apps/client/src-tauri/Cargo.toml --all-targets -- -D warnings

  deployment:
    name: Validate self-hosted deployment
    needs:
      - quality
      - workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example --profile landing config --quiet

      - name: Build deployment images
        run: docker compose --env-file .env.example build server client

      - name: Start deployment
        run: docker compose --env-file .env.example up --detach --no-build --wait --wait-timeout 180

      - name: Verify client and API health
        run: curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8080/v1/health/ready

      - name: Show deployment logs
        if: failure()
        run: docker compose --env-file .env.example logs --no-color

      - name: Stop deployment
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans

  landing-container:
    name: Build landing container
    needs:
      - quality
      - workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build landing image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: apps/landing/Dockerfile
          build-args: VITE_CLIENT_URL=https://app.example.com
          load: true
          pull: true
          push: false
          tags: northstar-landing:ci
          cache-from: type=gha,scope=northstar-landing
          cache-to: type=gha,mode=max,scope=northstar-landing
