name: Release

run-name: Release / ${{ github.sha }}

on:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: 10.33.2
  JAVA_VERSION: "21"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS_VERSION: 36.1.0
  ANDROID_NDK_VERSION: 30.0.14904198
  REGISTRY: ghcr.io
  VITE_SERVER_URL: ${{ vars.NORTHSTAR_SERVER_URL }}

jobs:
  metadata:
    name: Detect version release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      release: ${{ steps.release.outputs.release }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fetch release comparison commit
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^0{40}$ ]] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

      - name: Validate release metadata
        id: release
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/validate-release.mjs --base "$BASE_SHA"

  validation:
    name: Validate main commit
    needs: metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      delivery_gate: true

  desktop:
    name: Build ${{ matrix.name }}
    if: needs.metadata.outputs.release == 'true'
    needs:
      - metadata
      - validation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux desktop
            runner: ubuntu-24.04
            bundle: deb
            artifact: northstar-linux
            path: apps/client/src-tauri/target/release/bundle/deb/*.deb
          - name: Windows desktop
            runner: windows-latest
            bundle: nsis
            artifact: northstar-windows
            path: apps/client/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS desktop
            runner: macos-latest
            bundle: dmg
            artifact: northstar-macos
            path: apps/client/src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/client/src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop package
        run: pnpm --filter @workhard/client tauri build --bundles ${{ matrix.bundle }}

      - name: Upload desktop package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android:
    name: Build signed Android APK
    if: needs.metadata.outputs.release == 'true'
    needs:
      - metadata
      - validation
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      NORTHSTAR_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/client/src-tauri -> target

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Configure Android toolchain
        run: |
          ndk_home="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$ndk_home" ]; then
            echo "::error::Android NDK was not installed at $ndk_home."
            exit 1
          fi
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"

      - name: Configure Android release signing
        run: |
          signing_values=(
            "$ANDROID_KEYSTORE_BASE64"
            "$ANDROID_SIGNING_STORE_PASSWORD"
            "$ANDROID_SIGNING_KEY_ALIAS"
            "$ANDROID_SIGNING_KEY_PASSWORD"
          )
          signing_names=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          missing_names=()
          for index in "${!signing_values[@]}"; do
            if [ -z "${signing_values[$index]}" ]; then
              missing_names+=("${signing_names[$index]}")
            fi
          done
          if [ ${#missing_names[@]} -gt 0 ]; then
            echo "::error::Missing Android signing secrets: ${missing_names[*]}"
            exit 1
          fi

          signing_directory="$RUNNER_TEMP/android-signing"
          signing_store="$signing_directory/release.keystore"
          mkdir -p "$signing_directory"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_store"
          chmod 600 "$signing_store"
          if [ ! -s "$signing_store" ]; then
            echo "::error::Decoded Android keystore is empty."
            exit 1
          fi
          keytool -list \
            -keystore "$signing_store" \
            -storepass:env ANDROID_SIGNING_STORE_PASSWORD \
            -alias "$ANDROID_SIGNING_KEY_ALIAS" > /dev/null
          echo "ANDROID_SIGNING_STORE_FILE=$signing_store" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm clean Android project
        run: test ! -e apps/client/src-tauri/gen/android

      - name: Initialize Android project
        run: pnpm android:init

      - name: Build universal Android APK
        run: pnpm build:android

      - name: Sign and verify Android APK
        id: apk
        run: pnpm --filter @workhard/client android:sign

      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: northstar-android
          path: ${{ steps.apk.outputs.artifact_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Attest Android APK
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ steps.apk.outputs.artifact_path }}

      - name: Remove Android signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/android-signing/release.keystore"
          rmdir "$RUNNER_TEMP/android-signing" 2>/dev/null || true

  containers:
    name: Publish ${{ matrix.component }} image
    if: >-
      ${{
        always() &&
        needs.metadata.result == 'success' &&
        needs.validation.result == 'success' &&
        (
          needs.metadata.outputs.release != 'true' ||
          (needs.desktop.result == 'success' && needs.android.result == 'success')
        )
      }}
    needs:
      - metadata
      - validation
      - desktop
      - android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: northstar-ghcr-${{ matrix.component }}-publish
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            dockerfile: apps/server/Dockerfile
            title: Northstar server
            description: Northstar realtime API server
          - component: client
            dockerfile: apps/client/Dockerfile
            title: Northstar client
            description: Northstar web client and API proxy
          - component: landing
            dockerfile: apps/landing/Dockerfile
            title: Northstar landing site
            description: Northstar public landing site

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=${{ needs.metadata.outputs.version }},priority=1000,enable=${{ needs.metadata.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.metadata.outputs.release == 'true' && needs.metadata.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          annotations: ${{ steps.image.outputs.annotations }}
          cache-from: type=gha,scope=northstar-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=northstar-${{ matrix.component }}
          provenance: mode=max
          sbom: true

  publish:
    name: Publish GitHub release
    if: needs.metadata.outputs.release == 'true'
    needs:
      - metadata
      - desktop
      - android
      - containers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: github-release-${{ needs.metadata.outputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: northstar-*
          path: release-assets
          merge-multiple: true

      - name: Create checksum manifest
        working-directory: release-assets
        run: sha256sum ./* > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          existing_tag_commit="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
          if [ -n "$existing_tag_commit" ] && [ "$existing_tag_commit" != "$RELEASE_SHA" ]; then
            echo "::error::Tag $RELEASE_TAG points to $existing_tag_commit instead of $RELEASE_SHA."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            mapfile -t expected_names < <(printf '%s\n' "${assets[@]##*/}")
            mapfile -t existing_names < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            for existing_name in "${existing_names[@]}"; do
              if ! printf '%s\n' "${expected_names[@]}" | grep --fixed-strings --line-regexp --quiet -- "$existing_name"; then
                gh release delete-asset "$RELEASE_TAG" "$existing_name" --yes
              fi
            done
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            exit 0
          fi

          release_args=(
            "$RELEASE_TAG"
            "${assets[@]}"
            --generate-notes
            --title "Northstar $RELEASE_TAG"
          )
          if [ -n "$existing_tag_commit" ]; then
            release_args+=(--verify-tag)
          else
            release_args+=(--target "$RELEASE_SHA")
          fi
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "${release_args[@]}"
